name: QA CAD Noveno — sequential exercises
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cad-curriculum.js'
      - 'cad-progress-core.js'
      - 'module-zero.js'
      - 'module-zero-ui.js'
      - 'module-zero.css'
      - 'cad-polish.css'
      - 'cad-accessibility.css'
      - 'tests/**'
      - '.github/workflows/qa-cad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cad-content-and-progression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline and external JavaScript syntax
        run: |
          node --check cad-progress-core.js
          node --check cad-curriculum.js
          node --check module-zero.js
          node --check module-zero-ui.js
          node --check tests/cad-progress.test.cjs
          node -e 'const fs=require("fs");const html=fs.readFileSync("index.html","utf8");const m=html.match(/<script>\s*([\s\S]*?)<\/script>/);if(!m)process.exit(2);fs.writeFileSync("/tmp/cad-home-inline.js",m[1])'
          node --check /tmp/cad-home-inline.js
      - name: Run 26-unit progression, Module 0 and curriculum tests
        run: node --test tests/cad-progress.test.cjs
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify Module 0 and real UI for all 26 exercises
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cad-server.log 2>&1 &
          node tests/cad-browser.cjs

